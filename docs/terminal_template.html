<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin:0; background:#1e1e1e; font-family: 'Consolas','Menlo',monospace; }
  .terminal {
    background:#1e1e1e;
    border-radius:10px;
    overflow:hidden;
    width: 900px;
  }
  .barra {
    background:#323232;
    padding:10px 14px;
    display:flex;
    gap:8px;
  }
  .dot { width:12px;height:12px;border-radius:50%; }
  .r{background:#ff5f56;} .y{background:#ffbd2e;} .g{background:#27c93f;}
  pre {
    color:#e6e6e6;
    font-size:14px;
    line-height:1.6;
    padding:20px;
    margin:0;
    white-space:pre-wrap;
    word-break: break-word;
  }
  .prompt { color:#6bd06b; }
  .cmd { color:#f0e68c; }
</style>
</head>
<body>
<div class="terminal">
  <div class="barra"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div></div>
  <pre id="contenido"></pre>
</div>
</body>
</html>
